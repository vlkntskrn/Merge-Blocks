workflows:
  android-release:
    name: Android Release (AAB + APK)
    max_build_duration: 60
    instance_type: mac_mini_m2 # Android için Linux da olur, Codemagic hesabındaki uygun instance'a göre değiştirilebilir

    environment:
      flutter: stable
      # Codemagic > Settings > Code signing identities > Android keystores bölümüne
      # upload-keystore.jks bu referans adıyla yüklenir. Codemagic şu değişkenleri kendisi verir:
      # CM_KEYSTORE_PATH, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      android_signing:
        - merge_blocks_upload
      vars:
        PACKAGE_NAME: "com.vlkntskrn.mergeblocksneonchain"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $CM_BUILD_DIR/.dart_tool
        - $CM_BUILD_DIR/build

    scripts:
      - name: Show Flutter version
        script: flutter --version

      - name: Flutter pub get
        script: flutter pub get

      - name: Prepare Android signing
        script: |
          set -e
          test -s "$CM_KEYSTORE_PATH" || { echo "Keystore yok: Codemagic'te merge_blocks_upload tanımlı mı?"; exit 1; }
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
          # Şifreler loga yazılmaz; yalnız dosyanın oluştuğu doğrulanır
          test -s android/key.properties && echo "key.properties created"

      - name: Flutter analyze (optional)
        script: flutter analyze || true

      - name: Run tests (optional)
        script: flutter test || true

      # AAB (Play Store için önerilen)
      - name: Build App Bundle (AAB) - release
        script: flutter build appbundle --release

      # APK (cihaz testi için)
      - name: Build APK - release
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - "vlkntskrn@gmail.com"
        notify:
          success: true
          failure: true
