name: merge_blocks_neon_chain
description: Merge Blocks Neon Chain game
publish_to: 'none'

version: 1.0.2+39

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.3

  # AdMob (banner / rewarded / interstitial)
  google_mobile_ads: ^5.1.0

  # Google Play Billing (elmas paketleri + reklamsız). Billing Library 8+ için in_app_purchase_android ^0.5.0 (0.5.5 = Billing 9.1)
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
