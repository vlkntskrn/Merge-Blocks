name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Billing Library sürümü
        run: |
          v=$(grep -A2 "name: in_app_purchase_android" pubspec.lock | grep version | head -1)
          d=$(find "$HOME/.pub-cache/hosted" -path "*in_app_purchase_android-*/android/build.gradle*" -exec grep -ho "billingclient:billing[^\"']*" {} \; | sort -u | tr '\n' ' ')
          echo "::notice title=billing::in_app_purchase_android ${v} → ${d}"

      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "error •" analyze.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=flutter analyze::${msg}"
          fi
          exit $rc

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -vE "^\s*$" build.log | tail -60 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=flutter build apk::${msg}"
          fi
          exit $rc

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
